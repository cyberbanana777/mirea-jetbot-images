# registry.cookcloud.ru/jetbot_mirea/extra-humble-amd64-host  (ПК, amd64)
# Запуск: xhost +local: ; docker compose up -d ; docker compose exec extra-humble-amd64-host bash ; docker compose down
# Версия образа и базы, коммит репозитория, HOST_UID/HOST_GID берутся из .env (./set_host_ids.sh).
# Образ собирай скриптом ./build_image.sh.
services:
  extra-humble-amd64-host:
    image: registry.cookcloud.ru/jetbot_mirea/extra-humble-amd64-host:${VERSION:-v1.0.2}
    container_name: jetbot-extra-humble-amd64-host
    build:
      context: .
      args:
        BASE_IMAGE: registry.cookcloud.ru/base_images/ros2-base-humble-amd64:${BASE_VERSION:-v1.0.1}
        REPO_URL: ${REPO_URL}
        REPO_COMMIT: ${REPO_COMMIT}
        BUILD_JOBS: ${BUILD_JOBS:-4}
    # runtime: nvidia         # раскомментируй для Gazebo на видеокарте NVIDIA (нужен nvidia-container-toolkit)
    network_mode: host          # ноды видят робота и сеть без проброса портов (DDS)
    ipc: host
    privileged: true
    stdin_open: true
    tty: true
    restart: unless-stopped
    environment:
      HOST_UID: ${HOST_UID:-1000}   # UID/GID пользователя ros = хостовые
      HOST_GID: ${HOST_GID:-1000}
      DISPLAY: ${DISPLAY:-:0}       # окна Gazebo, RViz и Tk-GUI на экране хоста
      QT_X11_NO_MITSHM: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - ./user_data/developer_ws:/home/ros/developer_ws                       # твой код поверх jetbot_ws
      - ./user_data/extra_files_to_container:/home/ros/extra_files_to_container
      - ./user_data/ros2_custom_config_setup:/home/ros/ros2_custom_config_setup
